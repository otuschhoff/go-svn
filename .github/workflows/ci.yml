name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  pure-go:
    name: Pure Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - run: go build ./...
      - run: go test ./...

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test -race ./...

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  cross-compile:
    name: Cross-compile (windows/arm64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - run: go build ./...

  integration:
    name: Integration harness
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install Subversion and Apache modules
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion apache2 libapache2-mod-svn
      - run: go test -tags integration -v ./internal/testutil/servers

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./config, target: FuzzParse }
          - { package: ./delta, target: FuzzDecoder }
          - { package: ./delta, target: FuzzTxDeltaRoundTrip }
          - { package: ./fs/fsfs, target: FuzzLowLevelParsers }
          - { package: ./internal/lz4, target: FuzzDecodeBlock }
          - { package: ./mergeinfo, target: FuzzParse }
          - { package: ./props, target: FuzzTranslateRoundTrip }
          - { package: ./radav, target: FuzzMultistatusXML }
          - { package: ./rasvn, target: FuzzItemRoundTrip }
          - { package: ./rasvn, target: FuzzReader }
          - { package: ./svn/hashfile, target: FuzzRead }
          - { package: ./svn/path, target: FuzzURICanonicalize }
          - { package: ./svn/skel, target: FuzzParse }
          - { package: ./svn, target: FuzzParseDate }
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test '${{ matrix.package }}' -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime=10m
